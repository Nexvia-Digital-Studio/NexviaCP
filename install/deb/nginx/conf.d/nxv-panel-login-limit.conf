# NexviaCP: per-IP rate limiting for panel authentication endpoints.
# The map yields a non-empty key only for auth-form POSTs; nginx skips
# requests with an empty key, so nothing else on the panel is limited.
# $remote_addr is the real client address (realip + CF-Connecting-IP),
# which the origin-side fail2ban jails can never see.
map "$request_method:$request_uri" $nxv_login_limit_key {
	"~^POST:/login/?(\?.*)?$"    $binary_remote_addr;
	"~^POST:/reset2fa/?(\?.*)?$" $binary_remote_addr;
	default                      "";
}
limit_req_zone $nxv_login_limit_key zone=nxv_login_limit:10m rate=12r/m;
