name: NexviaCP CI Security & Quality Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-audit:
    name: Automated Security, Syntax & Regression Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: php-cli

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Grant Execution Permissions
        run: |
          chmod +x bin/v-* tests/*.py || true

      - name: Run NexviaCP Security & Syntax Test Suite
        run: |
          python3 tests/ci_security_audit.py
